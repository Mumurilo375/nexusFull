services:
  db:
    image: postgres:15
    container_name: nexus_db
    restart: "no"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_PATH_HOST}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: ../Dockerfile.backend
    container_name: nexus_backend
    restart: "no"
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      DB_LOGGING: ${DB_LOGGING}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DOCKER_DB_HOST}
      DB_PORT: ${DOCKER_DB_PORT}
    volumes:
      - type: bind
        source: ${BACKEND_STORAGE_PATH_HOST}
        target: /app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT}/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: "no"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: nexus_network
    driver: bridge
