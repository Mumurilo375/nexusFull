services:
  db:
    image: postgres:15
    container_name: nexus_db
    restart: "no"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_PATH_HOST}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: "no"
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: nexus_backend
    restart: "no"
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      DB_LOGGING: ${DB_LOGGING}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DOCKER_DB_HOST}
      DB_PORT: ${DOCKER_DB_PORT}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      PAYMENTS_SERVICE_URL: http://payments:3002
      PAYMENTS_SERVICE_SECRET: ${PAYMENTS_SERVICE_SECRET:-}
    volumes:
      - type: bind
        source: ${BACKEND_STORAGE_PATH_HOST}
        target: /app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT}/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  payments:
    build: ./payments
    restart: "no"
    environment:
      PAYMENTS_PORT: 3002
      PAYMENTS_SERVICE_SECRET: ${PAYMENTS_SERVICE_SECRET:-}
      BACKEND_INTERNAL_URL: http://backend:3000
      PAYMENTS_RETURN_URL: ${PAYMENTS_RETURN_URL:-https://nexus.store}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      MERCADO_PAGO_WEBHOOK_URL: ${MERCADO_PAGO_WEBHOOK_URL:-https://nexus.store/payments/webhook}
      MERCADO_PAGO_SANDBOX: ${MERCADO_PAGO_SANDBOX:-true}
    ports:
      - "127.0.0.1:${PAYMENTS_PORT_HOST:-3002}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: "no"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      payments:
        condition: service_healthy

  mobile:
    build:
      context: ./mobile
      dockerfile: ../Dockerfile.mobile
    container_name: nexus_mobile
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-https://nexus.store/api}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    volumes:
      - type: bind
        source: ./mobile
        target: /app
      - mobile_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: nexus_network
    driver: bridge

volumes:
  mobile_node_modules:
