        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      description: Página; padrão 1.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Itens por página; padrão 20, máximo 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: Entrada inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: VALIDATION_ERROR, message: Ocorreu um erro na solicitação. } } }
    Unauthorized:
      description: Token ausente, inválido, expirado ou usuário inexistente
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Usuário autenticado sem permissão ou propriedade do recurso
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Recurso não encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    LoginResponse:
      type: object
      required: [user, token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, description: JWT omitido em exemplos reais }
    User:
      type: object
      description: Representação serializada de usuário usada nos serviços; o campo passwordHash não deve ser exposto.
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        username: { type: string }
        fullName: { type: string, nullable: true }
        cpf: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    CreateUserInput:
      type: object
      required: [email, username, password, fullName, cpf]
      properties:
        email: { type: string, format: email }
        username: { type: string, minLength: 3, maxLength: 50 }
        password: { type: string, writeOnly: true, minLength: 8, description: 'Senha com pelo menos 8 caracteres, incluindo maiúscula, minúscula, número e caractere especial.' }
        fullName: { type: string }
        cpf: { type: string, description: CPF válido; normalizado para 11 dígitos. }
        avatarUrl: { type: string, nullable: true }
    UpdateUserInput:
      type: object
      description: O campo email não pode ser enviado. Caso um dos campos de perfil username, fullName ou cpf seja enviado, os três são exigidos pelo validador.
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        password: { type: string, writeOnly: true, minLength: 8 }
        fullName: { type: string }
        cpf: { type: string }
        avatarUrl: { type: string, nullable: true }
    Page:
      type: object
      description: Estrutura padrão produzida pelo helper de paginação; item concreto varia conforme o módulo.
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
        meta: { type: object, additionalProperties: true }
    GamePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Game' } }
        meta: { type: object, additionalProperties: true }
    Game:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        longDescription: { type: string }
        releaseDate: { type: string, format: date }
        coverImageUrl: { type: string }
        isActive: { type: boolean }
    GameDetails:
      allOf:
        - $ref: '#/components/schemas/Game'
        - type: object
          properties:
            platformListings: { type: array, items: { $ref: '#/components/schemas/Listing' } }
            reviewStats: { type: object, additionalProperties: true }
    CreateGameInput:
      type: object
      required: [title, description, longDescription, releaseDate, categoryIds]
      properties:
        title: { type: string }
        description: { type: string }
        longDescription: { type: string }
        releaseDate: { type: string, format: date }
        coverImageUrl: { type: string }
        isActive: { type: boolean, default: true }
        categoryIds: { type: array, minItems: 1, items: { type: integer, minimum: 1 }, description: Em multipart pode ser enviado serializado como JSON. }
        galleryItems:
          type: array
          items: { $ref: '#/components/schemas/GalleryItem' }
          description: Em multipart pode ser enviado serializado como JSON.
    UpdateGameInput:
      type: object
      minProperties: 1
      properties:
        title: { type: string }
        description: { type: string }
        longDescription: { type: string }
        releaseDate: { type: string, format: date }
        coverImageUrl: { type: string }
        isActive: { type: boolean }
        categoryIds: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
        galleryItems: { type: array, items: { $ref: '#/components/schemas/GalleryItem' } }
    GalleryItem:
      oneOf:
        - type: object
          required: [kind, id]
          properties: { kind: { type: string, enum: [existing] }, id: { type: integer, minimum: 1 } }
        - type: object
          required: [kind, fileIndex]
          properties: { kind: { type: string, enum: [file] }, fileIndex: { type: integer, minimum: 0 } }
        - type: object
          required: [kind, url]
          properties: { kind: { type: string, enum: [url] }, url: { type: string, minLength: 1 } }
    CategoryInput:
      type: object
      required: [name]
      properties: { name: { type: string, maxLength: 100 } }
    Category:
      allOf: [{ $ref: '#/components/schemas/CategoryInput' }, { type: object, properties: { id: { type: integer } } }]
    CreatePlatformInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 100 }
        iconUrl: { type: string, nullable: true }
    UpdatePlatformInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 100 }
        iconUrl: { type: string, nullable: true }
        isActive: { type: boolean }
    CreateListingInput:
      type: object
      required: [gameId, platformId, price]
      properties:
        gameId: { type: integer, minimum: 1 }
        platformId: { type: integer, minimum: 1 }
        price: { type: number, minimum: 0, exclusiveMinimum: true }
    UpdateListingInput:
      type: object
      minProperties: 1
      properties:
        price: { type: number, minimum: 0, exclusiveMinimum: true }
        isActive: { type: boolean }
    Listing:
      type: object
      properties:
        id: { type: integer }
        gameId: { type: integer }
        platformId: { type: integer }
        price: { type: number }
        isActive: { type: boolean }
    ListingPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Listing' } }
        meta: { type: object, additionalProperties: true }
    GamePlatformUpdate:
      type: object
      minProperties: 1
      properties:
        price: { type: number, minimum: 0, exclusiveMinimum: true }
        isActive: { type: boolean }
    PlatformKeysInput:
      type: object
      required: [keyValues]
      properties:
        keyValues: { type: array, minItems: 1, items: { type: string, pattern: '^[A-Z0-9]{4}(-[A-Z0-9]{4}){2}$' } }
    Stock:
      type: object
      required: [available, reserved, sold, total]
      properties:
        available: { type: integer }
        reserved: { type: integer }
        sold: { type: integer }
        total: { type: integer }
    ListingStock:
      type: object
      required: [listingId, stock]
      properties:
        listingId: { type: integer }
        stock: { $ref: '#/components/schemas/Stock' }
    CartItem:
      type: object
      required: [id, userId, listingId, quantity, addedAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        listingId: { type: integer }
        quantity: { type: integer }
        addedAt: { type: string, format: date-time }
    CartItemWithDetails:
      allOf:
        - $ref: '#/components/schemas/CartItem'
        - type: object
          required: [listing, stock, isQuantityAvailable]
          properties:
            listing: { $ref: '#/components/schemas/CartListing' }
            stock: { $ref: '#/components/schemas/Stock' }
            isQuantityAvailable: { type: boolean }
    CartListing:
      type: object
      properties:
        id: { type: integer }
        gameId: { type: integer }
        platformId: { type: integer }
        price: { type: string, description: Valor decimal serializado pelo PostgreSQL/Sequelize. }
        isActive: { type: boolean }
        game: { $ref: '#/components/schemas/GameRecord' }
        platform: { $ref: '#/components/schemas/PlatformRecord' }
    CartResponse:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CartItemWithDetails' } }
        meta:
          type: object
          required: [totalItems, subtotal, hasStockIssues]
          properties:
            totalItems: { type: integer }
            subtotal: { type: number }
            hasStockIssues: { type: boolean }
    CartQuantityInput:
      type: object
      required: [quantity]
      properties: { quantity: { type: integer, minimum: 1 } }
    CheckoutCreated:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/CheckoutSummary' }
    CheckoutResponse:
      type: object
      required: [order]
      properties:
        order:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/CheckoutSummary' }]
    CheckoutSummary:
      type: object
      required: [id, orderNumber, totalAmount, status, checkoutUrl, paymentExpiresAt]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        totalAmount: { type: string, description: Valor decimal serializado pelo PostgreSQL/Sequelize. }
        status: { type: string }
        checkoutUrl: { type: string, format: uri, nullable: true }
        paymentExpiresAt: { type: string, format: date-time, nullable: true }
    CheckoutCancelResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/CheckoutSummary' }
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    OrderPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UserOrder' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    UserOrder:
      type: object
      required: [id, orderNumber, userId, status, subtotal, discountAmount, totalAmount, paymentMethod, paymentStatus, createdAt, items]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        userId: { type: integer }
        status: { type: string }
        subtotal: { type: string }
        discountAmount: { type: string }
        totalAmount: { type: string }
        paymentMethod: { type: string }
        paymentStatus: { type: string }
        paymentConfirmedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        paymentReference: { type: string, format: uuid, nullable: true }
        checkoutUrl: { type: string, format: uri, nullable: true }
        paymentId: { type: string, nullable: true }
        paymentExpiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/UserOrderItem' } }
    UserOrderItem:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        listingId: { type: integer }
        gameKeyId: { type: integer, nullable: true }
        price: { type: string }
        createdAt: { type: string, format: date-time }
        listing: { $ref: '#/components/schemas/OrderListing' }
        gameKey: { $ref: '#/components/schemas/SoldGameKey' }
    OrderListing:
      type: object
      properties:
        id: { type: integer }
        gameId: { type: integer }
        platformId: { type: integer }
        price: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        game: { $ref: '#/components/schemas/GameRecord' }
        platform: { $ref: '#/components/schemas/PlatformRecord' }
    GameRecord:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        longDescription: { type: string }
        releaseDate: { type: string, format: date }
        coverImageUrl: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlatformRecord:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        iconUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    SoldGameKey:
      type: object
      description: Relação retornada nas consultas de pedido quando a chave possui status sold.
      properties:
        id: { type: integer }
        listingId: { type: integer }
        keyValue: { type: string, description: Chave digital entregue ao comprador. }
        status: { type: string, enum: [available, reserved, sold] }
        reservedAt: { type: string, format: date-time, nullable: true }
        soldAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    AdminOrderPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminOrderSummary' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    AdminOrderSummary:
      type: object
      required: [id, orderNumber, status, paymentStatus, totalAmount, createdAt, itemCount, user]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        totalAmount: { type: number }
        createdAt: { type: string, format: date-time }
        itemCount: { type: integer }
        user: { $ref: '#/components/schemas/AdminOrderUser' }
    AdminOrderDetails:
      type: object
      required: [id, orderNumber, status, paymentStatus, subtotal, discountAmount, totalAmount, paymentMethod, createdAt, user, items]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        subtotal: { type: number }
        discountAmount: { type: number }
        totalAmount: { type: number }
        paymentMethod: { type: string }
        createdAt: { type: string, format: date-time }
        paymentConfirmedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        user:
          allOf:
            - $ref: '#/components/schemas/AdminOrderUser'
            - type: object
              properties: { cpf: { type: string, nullable: true } }
        items: { type: array, items: { $ref: '#/components/schemas/AdminOrderItem' } }
    AdminOrderUser:
      type: object
      required: [id, username, email, fullName]
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        fullName: { type: string, nullable: true }
    AdminOrderItem:
      type: object
      properties:
        id: { type: integer }
        listingId: { type: integer }
        price: { type: number }
        createdAt: { type: string, format: date-time }
        listing:
          type: object
          properties:
            id: { type: integer }
            price: { type: number }
            isActive: { type: boolean }
            game:
              type: object
              properties:
                id: { type: integer }
                title: { type: string }
                coverImageUrl: { type: string }
            platform:
              type: object
              properties:
                id: { type: integer }
                name: { type: string }
                slug: { type: string }
    ReviewPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReviewWithRelations' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    Review:
      type: object
      required: [id, gameId, userId, rating, comment, createdAt, updatedAt]
      properties:
        id: { type: integer }
        gameId: { type: integer }
        userId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewWithRelations:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          properties:
            game: { $ref: '#/components/schemas/GameRecord' }
            user: { $ref: '#/components/schemas/ReviewUser' }
            votes: { type: array, items: { $ref: '#/components/schemas/ReviewVote' } }
    ReviewUser:
      type: object
      description: Usuário incluído na avaliação; o campo passwordHash é excluído pelo serviço.
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        username: { type: string }
        fullName: { type: string, nullable: true }
        cpf: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewVote:
      type: object
      properties:
        id: { type: integer }
        reviewId: { type: integer }
        userId: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateGameKeyInput:
      type: object
      required: [listingId, keyValue]
      properties:
        listingId: { type: integer, minimum: 1 }
        keyValue: { type: string, writeOnly: true, description: Chave omitida nos exemplos. }
    BulkCreateGameKeysInput:
      type: object
      required: [listingId, keyValues]
      properties:
        listingId: { type: integer, minimum: 1 }
        keyValues: { type: array, minItems: 1, items: { type: string, writeOnly: true } }
    BulkDeleteGameKeysInput:
      type: object
      required: [listingId, ids]
      properties:
        listingId: { type: integer, minimum: 1 }
        ids: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
    GameKeyStatusInput:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [available, reserved, sold] } }
    CreateReviewInput:
      type: object
      required: [gameId, rating, comment]
      properties:
        gameId: { type: integer, minimum: 1 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 1, maxLength: 500 }
    UpdateReviewInput:
      type: object
      required: [rating, comment]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 1, maxLength: 500 }
