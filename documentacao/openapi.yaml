openapi: 3.0.3
info:
  title: Nexus Full API
  version: 1.0.0
  description: >-
    Contrato dos principais endpoints implementados pelo backend Express do Nexus Full.
    Os caminhos são os caminhos reais do router; não incluem o prefixo /api usado por
    alguns proxies. Endpoints públicos omitem security. Endpoints protegidos exigem JWT.
servers:
  - url: http://localhost:3000
    description: Serviço local da API Nexus Full (porta interna padrão)
tags:
  - name: Autenticação
  - name: Usuários
  - name: Jogos
  - name: Categorias
  - name: Plataformas
  - name: Anúncios
  - name: Carrinho
  - name: Checkout
  - name: Pedidos
  - name: Administração
  - name: Chaves de jogos
  - name: Lista de desejos
  - name: Avaliações
security: []
paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica um usuário
      description: Rota pública. O email é normalizado para minúsculas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
            example: { email: jogador@example.com, password: '<senha>' }
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                user: { id: 7, email: jogador@example.com, username: jogador, fullName: Jogador Exemplo, cpf: null, avatarUrl: null, roles: [], permissions: [] }
                token: '<JWT>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Credenciais inválidas, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users:
    get:
      tags: [Usuários]
      summary: Lista usuários
      description: JWT obrigatório e permissão users.read.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Página de usuários, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuários]
      summary: Cria uma conta
      description: Rota pública. Pode receber avatarFile como arquivo multipart opcional.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateUserInput'
                - type: object
                  properties:
                    avatarFile: { type: string, format: binary }
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserInput' }
            example: { email: jogador@example.com, username: jogador, password: SenhaFicticia123!, fullName: Jogador Exemplo, cpf: '52998224725', avatarUrl: null }
      responses:
        '201': { description: Usuário criado, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Usuários]
      summary: Consulta usuário
      description: JWT obrigatório; o próprio usuário ou quem tem users.read pode consultar.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Usuário, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Usuários]
      summary: Atualiza usuário
      description: JWT obrigatório. A conta e as regras de propriedade são verificadas pelo serviço. O campo email não pode ser alterado. avatarFile é um arquivo multipart opcional.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UpdateUserInput' } }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/UpdateUserInput'
                - type: object
                  properties: { avatarFile: { type: string, format: binary } }
      responses:
        '200': { description: Usuário atualizado, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Usuários]
      summary: Exclui usuário
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Usuário excluído }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /games:
    get:
      tags: [Jogos]
      summary: Lista jogos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string }
          description: Busca por título.
      responses:
        '200': { description: Jogos e metadados de paginação, content: { application/json: { schema: { $ref: '#/components/schemas/GamePage' } } } }
    post:
      tags: [Jogos]
      summary: Cria jogo
      description: Requer catalog.manage. O formulário multipart aceita coverFile (0..1) e galleryFiles (0..12), além dos campos de CreateGameInput. O serviço exige imagem de capa por coverImageUrl ou arquivo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateGameInput'
                - type: object
                  properties:
                    coverFile: { type: string, format: binary }
                    galleryFiles: { type: array, maxItems: 12, items: { type: string, format: binary } }
            example: { title: Jogo de Exemplo, description: Descrição curta, longDescription: Descrição completa do jogo., releaseDate: '2025-05-20', coverImageUrl: 'https://example.invalid/capa.jpg', isActive: true, categoryIds: [1], galleryItems: [] }
      responses:
        '201': { description: Jogo criado, content: { application/json: { schema: { $ref: '#/components/schemas/Game' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /games/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Jogos]
      summary: Consulta jogo
      responses:
        '200': { description: Jogo, content: { application/json: { schema: { $ref: '#/components/schemas/Game' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Jogos]
      summary: Atualiza jogo
      description: Requer catalog.manage. O formulário multipart aceita os mesmos arquivos opcionais da criação.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/UpdateGameInput'
                - type: object
                  properties:
                    coverFile: { type: string, format: binary }
                    galleryFiles: { type: array, maxItems: 12, items: { type: string, format: binary } }
      responses:
        '200': { description: Jogo atualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Game' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Jogos]
      summary: Exclui jogo
      description: Requer catalog.manage. Jogos com histórico de pedidos não podem ser excluídos.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Jogo excluído }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Exclusão bloqueada por histórico de vendas }
  /games/{id}/details:
    get:
      tags: [Jogos]
      summary: Consulta detalhes e estatísticas de avaliação do jogo
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 'Detalhes do jogo, anúncios por plataforma e estatísticas de avaliação', content: { application/json: { schema: { $ref: '#/components/schemas/GameDetails' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/platforms:
    get:
      tags: [Jogos]
      summary: Lista plataformas e anúncios associados ao jogo
      description: Requer catalog.manage.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Plataformas e anúncios do jogo }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /games/{id}/platforms/{platformId}:
    put:
      tags: [Jogos]
      summary: Atualiza o anúncio da plataforma para o jogo
      description: Requer catalog.manage.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: platformId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GamePlatformUpdate' }, example: { price: 49.9, isActive: true } }
      responses:
        '200': { description: Estado atualizado da plataforma e do anúncio }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /games/{id}/platforms/{platformId}/keys:
    post:
      tags: [Chaves de jogos]
      summary: Adiciona chaves ao estoque da plataforma
      description: Requer inventory.manage. Não incluir chaves reais em exemplos.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: platformId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PlatformKeysInput' }, example: { keyValues: ['XXXX-XXXX-XXXX'] } }
      responses:
        '201': { description: Resultado da inclusão }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /categories:
    get:
      tags: [Categorias]
      summary: Lista categorias
      description: Exige JWT.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Página de categorias, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Categorias]
      summary: Cria categoria
      description: Requer catalog.manage.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CategoryInput' }, example: { name: RPG } }
      responses:
        '201': { description: Categoria criada, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Categorias]
      summary: Consulta categoria
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Categoria, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categorias]
      summary: Atualiza categoria
      description: Requer catalog.manage.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } }
      responses:
        '200': { description: Categoria atualizada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Categorias]
      summary: Exclui categoria
      description: Requer catalog.manage.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Categoria excluída }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platforms:
    get:
      tags: [Plataformas]
      summary: Lista plataformas
      description: Exige JWT.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Página de plataformas }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Plataformas]
      summary: Cria plataforma
      description: Requer catalog.manage. iconFile é upload opcional.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreatePlatformInput' } }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreatePlatformInput'
                - type: object
                  properties: { iconFile: { type: string, format: binary } }
      responses:
        '201': { description: Plataforma criada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platforms/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Plataformas]
      summary: Consulta plataforma
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Plataforma }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Plataformas]
      summary: Atualiza plataforma
      description: Requer catalog.manage. iconFile é upload opcional.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UpdatePlatformInput' } }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/UpdatePlatformInput'
                - type: object
                  properties: { iconFile: { type: string, format: binary } }
      responses:
        '200': { description: Plataforma atualizada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Plataformas]
      summary: Exclui plataforma
      description: Requer catalog.manage.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Plataforma excluída }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /listings:
    get:
      tags: [Anúncios]
      summary: Lista anúncios de jogos por plataforma
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: gameId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: includeStock
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: Anúncios e metadados, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } }
    post:
      tags: [Anúncios]
      summary: Cria anúncio
      description: Requer catalog.manage.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateListingInput' }, example: { gameId: 1, platformId: 2, price: 59.9 } }
      responses:
        '201': { description: Anúncio criado, content: { application/json: { schema: { $ref: '#/components/schemas/Listing' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Já existe anúncio para esse jogo e plataforma }
  /listings/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Anúncios]
      summary: Consulta anúncio
      responses:
        '200': { description: Anúncio }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Anúncios]
      summary: Atualiza anúncio
      description: Requer catalog.manage.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UpdateListingInput' } }
      responses:
        '200': { description: Anúncio atualizado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Anúncios]
      summary: Exclui anúncio
      description: Requer catalog.manage.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Anúncio excluído }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /listings/{id}/details:
    get:
      tags: [Anúncios]
      summary: Consulta anúncio com preço, estoque, promoções e avaliações
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Detalhes do anúncio }
        '404': { $ref: '#/components/responses/NotFound' }
  /listings/{id}/stock:
    get:
      tags: [Anúncios]
      summary: Consulta estoque do anúncio
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Estoque do anúncio, content: { application/json: { schema: { $ref: '#/components/schemas/ListingStock' }, example: { listingId: 12, stock: { available: 5, reserved: 1, sold: 2, total: 8 } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart:
    get:
      tags: [Carrinho]
      summary: Lista carrinho do usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Carrinho do usuário autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
              example:
                items:
                  - id: 31
                    userId: 7
                    listingId: 12
                    quantity: 1
                    addedAt: '2026-11-12T10:30:00.000Z'
                    listing:
                      id: 12
                      gameId: 4
                      platformId: 2
                      price: '59.90'
                      isActive: true
                      game: { id: 4, title: Jogo de Exemplo, description: Descrição curta, longDescription: Descrição completa, releaseDate: '2025-05-20', coverImageUrl: 'https://example.invalid/capa.jpg', isActive: true, createdAt: '2026-01-02T12:00:00.000Z', updatedAt: '2026-01-02T12:00:00.000Z' }
                      platform: { id: 2, name: Plataforma Exemplo, slug: plataforma-exemplo, iconUrl: null, isActive: true, createdAt: '2026-01-02T12:00:00.000Z' }
                    stock: { available: 5, reserved: 1, sold: 2, total: 8 }
                    isQuantityAvailable: true
                meta: { totalItems: 1, subtotal: 59.9, hasStockIssues: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Carrinho]
      summary: Limpa carrinho
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Carrinho limpo }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cart/{listingId}:
    parameters:
      - name: listingId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [Carrinho]
      summary: Adiciona anúncio ao carrinho
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Item criado no carrinho.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartItem' }
              example: { id: 31, userId: 7, listingId: 12, quantity: 1, addedAt: '2026-11-12T10:30:00.000Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Carrinho]
      summary: Altera quantidade do item
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CartQuantityInput' }, example: { quantity: 1 } }
      responses:
        '200':
          description: Quantidade atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartItem' }
              example: { id: 31, userId: 7, listingId: 12, quantity: 2, addedAt: '2026-11-12T10:30:00.000Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Carrinho]
      summary: Remove item do carrinho
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Item removido }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /checkout:
    get:
      tags: [Checkout]
      summary: Consulta checkout atual do usuário
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Resumo atual da finalização da compra; o campo order é nulo quando não há pedido pendente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
              example:
                order: { id: 81, orderNumber: NEX-7-1762943400000, totalAmount: '59.90', status: pending, checkoutUrl: 'https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=exemplo', paymentExpiresAt: '2026-11-12T11:00:00.000Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Checkout]
      summary: Cria pedido e inicia checkout do carrinho
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Pedido criado e checkout iniciado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutCreated' }
              example:
                order: { id: 81, orderNumber: NEX-7-1762943400000, totalAmount: '59.90', status: pending, checkoutUrl: 'https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=exemplo', paymentExpiresAt: '2026-11-12T11:00:00.000Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Falha de estado ou de reserva conforme o erro de domínio }
  /checkout/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Checkout]
      summary: Consulta checkout de um pedido
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Resumo do pedido no checkout.
